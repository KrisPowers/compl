[package]
name = "autocomplete"
version = "0.1.0"
edition = "2021"
description = "Inline, as-you-type suggestions for commands and paths in every terminal and shell."
license = "MIT"
repository = "https://github.com/KrisPowers/autocomplete"
readme = "README.md"
keywords = ["terminal", "autocomplete", "shell", "completion", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "scripts/"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
crossterm = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
