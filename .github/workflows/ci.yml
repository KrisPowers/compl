name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  shells:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish shellcheck
      - name: Check syntax
        run: |
          bash -n shell/bash.sh
          sh -n shell/init/posix.sh
          bash -n shell/init/posix.sh
          for f in shell/zsh/*.zsh shell/init/posix.sh; do zsh -n "$f"; done
          fish --no-execute shell/fish.fish
          fish --no-execute shell/init/fish.fish
          shellcheck scripts/install.sh scripts/formula.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in 'shell/pwsh.ps1', 'shell/init/pwsh.ps1', 'scripts/install.ps1', 'scripts/build.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${file}: $_" }; exit 1 }
          }
